<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Hilos</title>
<style>
@font-face{font-family:'Fredoka';font-style:normal;font-weight:300 700;font-display:swap;src:url(fonts/fredoka-latin.woff2) format('woff2');}
</style>
<style>
/* Prototipo B. Una bola de lana cuelga de hilos que se cortan con el dedo y reventan si se estiran demasiado.
   Misma familia visual que el prototipo A (fieltro, costuras, botones) para comparar solo la mecánica. */
:root{
  --crema:#F6E9CF;
  --crema-oscuro:#E7D3AA;
  --tinta:#4A3B47;
  --coral:#F2877B;
  --sol:#FFD166;
  --lila:#9FA8F0;
  --display:'Fredoka',ui-rounded,'Hiragino Maru Gothic ProN','Segoe UI Rounded',system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--crema);color:var(--tinta);font-family:var(--display);
  overscroll-behavior:none;overflow:hidden;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.bar{position:fixed;left:0;right:0;top:0;height:56px;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;pointer-events:none}
.grp{display:flex;align-items:center;gap:8px;pointer-events:auto}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.btn{width:44px;height:44px;border-radius:14px;background:var(--crema-oscuro);display:grid;place-items:center;
  box-shadow:0 3px 0 #CDB787, inset 0 1px 0 rgba(255,255,255,.55);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #CDB787, inset 0 1px 0 rgba(255,255,255,.55)}
.btn:focus-visible,.pill:focus-visible,.cta:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn svg{width:22px;height:22px;stroke:var(--tinta);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.btn.off{opacity:.55}
.lvl{min-width:104px;text-align:center;font-weight:600;font-size:18px;letter-spacing:.2px}
.hint{position:fixed;left:50%;top:60px;transform:translateX(-50%);max-width:min(94vw,460px);text-align:center;
  background:rgba(74,59,71,.9);color:#fff;padding:8px 16px;border-radius:999px;font-size:15px;line-height:1.25;pointer-events:none;transition:opacity .35s;z-index:2}
.hint.gone{opacity:0}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(74,59,71,.38);padding:16px}
.overlay[hidden]{display:none}
.card{width:min(92vw,340px);background:var(--crema);border-radius:26px;padding:22px 20px 18px;text-align:center;
  box-shadow:0 8px 0 #CDB787,0 18px 40px rgba(0,0,0,.25);animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0 0 4px;font-size:30px;font-weight:600}
.card .sub{margin:0 0 14px;opacity:.75;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.stat{background:#fff8e8;border-radius:14px;padding:8px 4px}
.stat b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;opacity:.7}
.cta{display:block;width:100%;padding:13px;border-radius:16px;background:var(--coral);color:#fff;font-size:19px;font-weight:600;
  box-shadow:0 4px 0 #C9665B;margin-bottom:10px}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #C9665B}
.row{display:flex;gap:8px}
.pill{flex:1;padding:10px;border-radius:14px;background:var(--crema-oscuro);font-size:15px;font-weight:500;box-shadow:0 3px 0 #CDB787}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 #CDB787}
.pill.on{background:var(--lila);color:#fff;box-shadow:0 3px 0 #7983D6}
.panel{position:fixed;left:0;right:0;bottom:0;background:var(--crema);border-radius:24px 24px 0 0;padding:16px 18px 20px;
  box-shadow:0 -8px 30px rgba(0,0,0,.25);max-height:78%;overflow:auto}
.panel[hidden]{display:none}
.panel h3{margin:0 0 4px;font-size:20px}
.panel p.note{margin:0 0 12px;font-size:13px;opacity:.7;line-height:1.3}
.ctl{display:grid;grid-template-columns:1fr 54px;gap:2px 10px;align-items:center;margin-bottom:8px}
.ctl label{font-size:15px}
.ctl output{font-variant-numeric:tabular-nums;text-align:right;font-size:14px;opacity:.8}
.ctl input{grid-column:1 / -1;width:100%;accent-color:var(--coral);height:28px}
.toast{position:fixed;left:50%;bottom:150px;transform:translateX(-50%);max-width:min(92vw,420px);background:rgba(74,59,71,.94);color:#fff;
  padding:10px 16px;border-radius:16px;font-size:14px;line-height:1.3;text-align:center;z-index:5}
.toast[hidden]{display:none}
h4{margin:10px 0 6px;font-size:15px}
@media (prefers-reduced-motion:reduce){.card{animation:none}.hint{transition:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" aria-label="Tablero del juego"></canvas></div>

<div class="bar">
  <div class="grp">
    <button class="btn" id="prev" aria-label="Nivel anterior"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="lvl" id="lvl">Nivel 1 de 4</div>
    <button class="btn" id="next" aria-label="Nivel siguiente"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
  </div>
  <div class="grp">
    <button class="btn" id="restart" aria-label="Reiniciar nivel"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></button>
    <button class="btn" id="snd" aria-label="Sonido"><svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M17 9a4 4 0 0 1 0 6"/></svg></button>
    <button class="btn" id="cfg" aria-label="Ajustes de sensación"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
</div>

<div class="hint" id="hint"></div>
<div class="toast" id="toast" hidden></div>

<div class="overlay" id="win" hidden>
  <div class="card" role="dialog" aria-labelledby="winT">
    <h2 id="winT">¡Listo!</h2>
    <p class="sub" id="winS"></p>
    <div class="stats">
      <div class="stat"><b id="sT">0</b><span>segundos</span></div>
      <div class="stat"><b id="sD">0</b><span>cortes</span></div>
      <div class="stat"><b id="sP">0</b><span>reventados</span></div>
    </div>
    <button class="cta" id="again2">Siguiente nivel</button>
    <div class="row"><button class="pill" id="retry">Repetir</button><button class="pill" id="copy">Copiar resultado</button></div>
  </div>
</div>

<div class="panel" id="panel" hidden>
  <h3>Sensación de juego</h3>
  <p class="note">Mueve los controles y prueba. Los valores se guardan en este navegador.</p>
  <div id="ctls"></div>
  <h4>Control de la gravedad (niveles 3 y 4)</h4>
  <div class="row"><button class="pill" id="mDial">Dial en pantalla</button><button class="pill" id="mTilt">Inclinar el teléfono</button></div>
  <p class="note" style="margin-top:8px">La inclinación usa el sensor de movimiento del teléfono. Si el sensor no responde, el juego vuelve al dial.</p>
  <div class="row" style="margin-top:6px"><button class="pill" id="reset">Restaurar valores</button><button class="pill" id="closeP">Cerrar</button></div>
</div>

<script>
(() => {
'use strict';
if (!CanvasRenderingContext2D.prototype.roundRect) CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) { r = Math.min(r, w / 2, h / 2); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); };
const W = 10, H = 15, DT = 1 / 240;
const CORE_R = 0.5, GOAL_R = 0.8;
const DEFAULTS = { g: 22, k: 90, tmax: 45, cutTol: 30, hitstop: 70, shake: 5 };
const P = Object.assign({}, DEFAULTS);
try { const s = JSON.parse(localStorage.getItem('hilos.P') || '{}'); for (const k in DEFAULTS) if (typeof s[k] === 'number') P[k] = s[k]; } catch (e) {}
let gravMode = 'dial';
try { gravMode = localStorage.getItem('hilos.mode') === 'tilt' ? 'tilt' : 'dial'; } catch (e) {}
const YARN = ['#F2877B', '#FFD166', '#7CCDB9', '#F58FB3'];
const CONF = ['#F2877B', '#FFD166', '#7CCDB9', '#F58FB3', '#8FA8F0'];
const PENTA = [261.63, 293.66, 329.63, 392.0, 440.0, 523.25, 587.33, 659.25, 783.99];

/* ---------- Niveles ---------- */
const LEVELS = [
  { hint: 'Toca un hilo para cortarlo.', dial: false,
    anchors: [[5, 2]], core: [5, 5.8], goal: [5, 12.4], spikes: [] },
  { hint: 'Corta un hilo y corta el otro en el momento justo.', dial: false,
    anchors: [[3, 2.2], [7, 2.2]], core: [5, 6.4], goal: [8.3, 11.2], spikes: [{ x: 0, y: 13.6, w: 7, h: 1.4 }] },
  { hint: 'Gira la gravedad con el dial y corta los hilos.', dial: true,
    anchors: [[3, 2.2], [7, 2.2]], core: [5, 6.2], goal: [1.5, 10.6], spikes: [{ x: 3.4, y: 13.6, w: 6.6, h: 1.4 }] },
  { hint: 'El hilo revienta si lo estiras. Úsalo para lanzar.', dial: true,
    anchors: [[5, 1.8]], core: [5, 7], goal: [8.6, 10.6], spikes: [{ x: 0, y: 13.6, w: 7, h: 1.4 }, { x: 6.2, y: 6.2, w: 0.8, h: 4.4 }] }
];

/* ---------- Estado ---------- */
let li = 0, lv = null, core = null, threads = [], parts = [], whips = [];
let gx = 0, gy = 1;                  // dirección de gravedad (unitaria)
let freeze = 0, shakeT = 0, timeNow = 0;
let audioOn = true, ac = null;
try { audioOn = localStorage.getItem('hilos.snd') !== '0'; } catch (e) {}
const dial = { cx: 0, cy: 0, r: 44, active: false, vis: false };

function loadLevel(n, keep) {
  li = (n + LEVELS.length) % LEVELS.length;
  const d = LEVELS[li];
  core = { x: d.core[0], y: d.core[1], vx: 0, vy: 0, st: 'play', t: 0, sq: 0, sqx: 0, sqy: 1, stress: 0 };
  threads = d.anchors.map((a, i) => {
    const L = Math.hypot(a[0] - core.x, a[1] - core.y);
    return { ax: a[0], ay: a[1], L, alive: true, col: YARN[i % YARN.length], T: 0, idx: i };
  });
  parts = []; whips = []; freeze = 0; shakeT = 0; gx = 0; gy = 1;
  lv = { d, time: 0, cuts: 0, snaps: 0, state: 'play', wait: 0, attempts: keep ? lv.attempts + 1 : 0 };
  document.getElementById('lvl').textContent = 'Nivel ' + (li + 1) + ' de ' + LEVELS.length;
  const hint = document.getElementById('hint'); hint.textContent = d.hint; hint.classList.remove('gone');
  document.getElementById('win').hidden = true;
  resize();
}

/* ---------- Simulación ---------- */
function simStep() {
  timeNow += DT;
  if (freeze > 0) { freeze -= DT; return; }
  if (lv.state === 'play') lv.time += DT;
  if (core.st === 'in') { core.t += DT; const g = lv.d.goal; core.x += (g[0] - core.x) * Math.min(1, DT * 14); core.y += (g[1] - core.y) * Math.min(1, DT * 14); }
  else if (core.st === 'dead') { core.t += DT; }
  else {
    let fx = P.g * gx - 0.35 * core.vx, fy = P.g * gy - 0.35 * core.vy, maxS = 0;
    for (const t of threads) {
      if (!t.alive) continue;
      const dx = t.ax - core.x, dy = t.ay - core.y, d = Math.hypot(dx, dy) || 1e-6;
      const T = Math.max(0, P.k * (d - t.L)); t.T = T;
      if (T > P.tmax) { snap(t, true); continue; }
      maxS = Math.max(maxS, T / P.tmax);
      fx += T * dx / d; fy += T * dy / d;
    }
    core.stress = maxS;
    { const g = lv.d.goal, dx = g[0] - core.x, dy = g[1] - core.y, dd = Math.hypot(dx, dy), reach = GOAL_R * 1.5;
      if (dd < reach) { const w = 1 - dd / reach; fx += dx * 30 * w - core.vx * 3 * w; fy += dy * 30 * w - core.vy * 3 * w; } }
    core.vx += fx * DT; core.vy += fy * DT;
    const sp = Math.hypot(core.vx, core.vy); if (sp > 30) { core.vx *= 30 / sp; core.vy *= 30 / sp; }
    core.x += core.vx * DT; core.y += core.vy * DT;
    if (core.x < CORE_R) { core.x = CORE_R; if (core.vx < 0) { hit(-core.vx, 1, 0); core.vx *= -0.4; } }
    if (core.x > W - CORE_R) { core.x = W - CORE_R; if (core.vx > 0) { hit(core.vx, -1, 0); core.vx *= -0.4; } }
    if (core.y < CORE_R) { core.y = CORE_R; if (core.vy < 0) { hit(-core.vy, 0, 1); core.vy *= -0.4; } }
    if (core.y > H - CORE_R) { core.y = H - CORE_R; if (core.vy > 0) { hit(core.vy, 0, -1); core.vy *= -0.4; } }
    for (const s of lv.d.spikes) {
      if (core.x > s.x - 0.1 && core.x < s.x + s.w + 0.1 && core.y + CORE_R * 0.6 > s.y && core.y - CORE_R * 0.6 < s.y + s.h) { die(); break; }
    }
    const g = lv.d.goal;
    if (core.st === 'play' && Math.hypot(g[0] - core.x, g[1] - core.y) < 0.7) { core.st = 'in'; core.t = 0; for (const t of threads) t.alive = false; sound('win'); }
  }
  if (lv.state === 'play') {
    if (core.st === 'in' && core.t > 0.35) { lv.state = 'won'; lv.wait = 0.45; winFx(); }
    else if (core.st === 'dead' && core.t > 0.6) loadLevel(li, true);
  } else if (lv.state === 'won') { lv.wait -= DT; if (lv.wait <= 0) { lv.state = 'done'; showWin(); } }
}
let hitCd = 0;
function hit(sp, nx, ny) {
  if (sp < 3 || timeNow < hitCd) return;
  hitCd = timeNow + 0.1; core.sq = Math.min(1, sp / 12); core.sqx = nx; core.sqy = ny;
  note(2 + Math.floor(Math.random() * 4), 0.1, Math.min(0.18, 0.04 + sp * 0.01), 'triangle'); if (sp > 7) vib(8);
}
function die() { core.st = 'dead'; core.t = 0; for (let k = 0; k < 18; k++) { const a = Math.random() * 6.283, s = 2 + Math.random() * 4; parts.push({ x: core.x, y: core.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s - 2, r: 5, life: 0.9, c: '#FFD166' }); }
  tone(300, 0.35, 0.14, 'sine', 70); vib(30); freeze = 0.05; shakeT = 0.3; }
function snap(t, byTension) {
  t.alive = false;
  const cx = core.x, cy = core.y;
  whips.push({ ax: t.ax, ay: t.ay, bx: cx, by: cy, col: t.col, life: 0.35, seed: Math.random() * 6 });
  freeze = P.hitstop / 1000; shakeT = 0.28;
  note(t.idx % 4 + (byTension ? 0 : 3), 0.3, 0.16, byTension ? 'sawtooth' : 'sine'); vib(byTension ? [10, 20, 10] : 12);
  if (byTension) lv.snaps++; else lv.cuts++;
  for (let k = 0; k < 8; k++) { const a = Math.random() * 6.283; parts.push({ x: (t.ax + cx) / 2, y: (t.ay + cy) / 2, vx: Math.cos(a) * 3, vy: Math.sin(a) * 3, r: 3, life: 0.4, c: t.col }); }
}
function segHit(ax, ay, bx, by, px, py, tol) {          // distancia punto-segmento
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy || 1e-6;
  let u = ((px - ax) * dx + (py - ay) * dy) / l2; u = Math.max(0, Math.min(1, u));
  return Math.hypot(ax + u * dx - px, ay + u * dy - py) < tol;
}
function segCross(p, q, r, s) {                          // intersección de dos segmentos
  const d = (q[0] - p[0]) * (s[1] - r[1]) - (q[1] - p[1]) * (s[0] - r[0]); if (Math.abs(d) < 1e-9) return false;
  const t = ((r[0] - p[0]) * (s[1] - r[1]) - (r[1] - p[1]) * (s[0] - r[0])) / d, u = ((r[0] - p[0]) * (q[1] - p[1]) - (r[1] - p[1]) * (q[0] - p[0])) / d;
  return t >= 0 && t <= 1 && u >= 0 && u <= 1;
}
function tryCutPoint(x, y) {
  if (lv.state !== 'play' || core.st !== 'play') return;
  const tol = Math.max(0.6, P.cutTol / sc);
  let best = null, bd = 1e9;
  for (const t of threads) { if (!t.alive) continue;
    const dx = core.x - t.ax, dy = core.y - t.ay, l2 = dx * dx + dy * dy || 1e-6;
    let u = ((x - t.ax) * dx + (y - t.ay) * dy) / l2; u = Math.max(0, Math.min(1, u));
    const dd = Math.hypot(t.ax + u * dx - x, t.ay + u * dy - y);
    if (dd < tol && dd < bd) { bd = dd; best = t; } }
  if (best) snap(best, false);
}
function trySwipe(a, b) {
  if (lv.state !== 'play' || core.st !== 'play') return;
  for (const t of threads) if (t.alive && segCross(a, b, [t.ax, t.ay], [core.x, core.y])) snap(t, false);
}

/* ---------- Entrada ---------- */
const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
let dpr = 1, vw = 0, vh = 0, sc = 1, ox = 0, oy = 0;
function resize() {
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  vw = cv.clientWidth; vh = cv.clientHeight; cv.width = Math.round(vw * dpr); cv.height = Math.round(vh * dpr);
  dial.vis = !!(lv && lv.d.dial && gravMode === 'dial');
  const top = 62, bottom = dial.vis ? 118 : 14, mx = 12;
  sc = Math.min((vw - 2 * mx) / W, (vh - top - bottom) / H);
  ox = (vw - W * sc) / 2; oy = top + (vh - top - bottom - H * sc) / 2;
  dial.cx = vw / 2; dial.cy = vh - 58;
}
window.addEventListener('resize', resize);
const pts = new Map();
function wpos(e) { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left - ox) / sc, (e.clientY - r.top - oy) / sc, e.clientX - r.left, e.clientY - r.top]; }
function setDial(px, py) {
  const dx = px - dial.cx, dy = py - dial.cy, d = Math.hypot(dx, dy);
  if (d > 6) { gx = dx / d; gy = dy / d; }
}
cv.addEventListener('pointerdown', e => {
  initAudio();
  const [x, y, px, py] = wpos(e);
  document.getElementById('hint').classList.add('gone');
  if (dial.vis && Math.hypot(px - dial.cx, py - dial.cy) < dial.r + 22) { dial.active = e.pointerId; cv.setPointerCapture(e.pointerId); setDial(px, py); return; }
  cv.setPointerCapture(e.pointerId); pts.set(e.pointerId, [x, y]); tryCutPoint(x, y);
});
cv.addEventListener('pointermove', e => {
  const [x, y, px, py] = wpos(e);
  if (dial.active === e.pointerId) { setDial(px, py); return; }
  const p = pts.get(e.pointerId); if (!p) return;
  trySwipe(p, [x, y]); pts.set(e.pointerId, [x, y]);
});
const up = e => { pts.delete(e.pointerId); if (dial.active === e.pointerId) dial.active = false; };
cv.addEventListener('pointerup', up); cv.addEventListener('pointercancel', up);

/* Inclinación: el sensor entrega el empuje opuesto a la gravedad (convención de Android). */
let tiltSeen = false, tiltTimer = 0;
function onMotion(e) {
  const a = e.accelerationIncludingGravity; if (!a || a.x == null || a.y == null) return;
  tiltSeen = true;
  const x = -a.x, y = a.y, d = Math.hypot(x, y);
  if (d > 2.5) { gx += (x / d - gx) * 0.25; gy += (y / d - gy) * 0.25; const n = Math.hypot(gx, gy) || 1; gx /= n; gy /= n; }
}
function enableTilt() {
  window.removeEventListener('devicemotion', onMotion); window.addEventListener('devicemotion', onMotion);
  tiltSeen = false; clearTimeout(tiltTimer);
  tiltTimer = setTimeout(() => { if (!tiltSeen) { setMode('dial'); toast('Este navegador no entrega el sensor de movimiento. Usa el dial.'); } }, 1600);
}
function setMode(m) {
  gravMode = m; try { localStorage.setItem('hilos.mode', m); } catch (e) {}
  if (m === 'tilt') enableTilt(); else window.removeEventListener('devicemotion', onMotion);
  document.getElementById('mDial').classList.toggle('on', m === 'dial'); document.getElementById('mTilt').classList.toggle('on', m === 'tilt');
  resize();
}
let toastT = 0;
function toast(s) { const t = document.getElementById('toast'); t.textContent = s; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, 5200); }

/* ---------- Audio y háptica ---------- */
function initAudio() { if (!audioOn) return; try { ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); } catch (e) { ac = null; } }
function tone(f, d, vol, type, f2) {
  if (!audioOn || !ac) return;
  try { const t = ac.currentTime, o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + 0.01); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g).connect(ac.destination); o.start(t); o.stop(t + d + 0.02); } catch (e) {}
}
function note(i, d, vol, type) { tone(PENTA[Math.min(PENTA.length - 1, i)] * (1 + (Math.random() - 0.5) * 0.12), d, vol, type); }
function sound(k) { if (k === 'win') note(6, 0.2, 0.12, 'sine'); }
function vib(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }

/* ---------- Victoria ---------- */
function winFx() {
  [0, 2, 4, 5, 7].forEach((n, k) => setTimeout(() => note(n, 0.28, 0.13, 'sine'), k * 90)); vib([20, 40, 20]);
  const g = lv.d.goal;
  for (let k = 0; k < 46; k++) { const a = Math.random() * 6.283, s = 3 + Math.random() * 6;
    parts.push({ x: g[0], y: g[1], vx: Math.cos(a) * s, vy: Math.sin(a) * s - 3, r: Math.random() * 6, life: 1.3, c: CONF[k % CONF.length] }); }
}
function statsText() {
  return 'Hilos, nivel ' + (li + 1) + ': ' + lv.time.toFixed(1).replace('.', ',') + ' s, ' + lv.cuts + ' cortes, ' + lv.snaps + ' hilos reventados' + (lv.attempts ? ', ' + (lv.attempts + 1) + ' intentos' : '');
}
function showWin() {
  const last = li === LEVELS.length - 1;
  document.getElementById('winT').textContent = last ? '¡Completado!' : '¡Listo!';
  document.getElementById('winS').textContent = lv.attempts ? 'Nivel ' + (li + 1) + ' en ' + (lv.attempts + 1) + ' intentos' : 'Nivel ' + (li + 1) + ' a la primera';
  document.getElementById('sT').textContent = lv.time.toFixed(1).replace('.', ',');
  document.getElementById('sD').textContent = lv.cuts; document.getElementById('sP').textContent = lv.snaps;
  document.getElementById('again2').textContent = last ? 'Volver al nivel 1' : 'Siguiente nivel';
  document.getElementById('copy').textContent = 'Copiar resultado'; document.getElementById('win').hidden = false;
}

/* ---------- Dibujo ---------- */
const quilt = (() => { const c = document.createElement('canvas'); c.width = c.height = 24; const x = c.getContext('2d');
  x.strokeStyle = 'rgba(70,80,160,0.55)'; x.lineWidth = 1; x.beginPath(); x.moveTo(0, 12); x.lineTo(12, 0); x.lineTo(24, 12); x.lineTo(12, 24); x.closePath(); x.stroke(); return c; })();
function rr(x, y, w, hh, r) { ctx.beginPath(); ctx.roundRect(x, y, w, hh, r); }
function mix(c1, c2, u) { return 'rgb(' + c1.map((v, i) => Math.round(v + (c2[i] - v) * u)).join(',') + ')'; }
function curve(ax, ay, bx, by, L, wob) {      // hilo con holgura: cuelga hacia la gravedad
  const X1 = ox + ax * sc, Y1 = oy + ay * sc, X2 = ox + bx * sc, Y2 = oy + by * sc;
  const d = Math.hypot(bx - ax, by - ay), slack = Math.max(0, L - d), sag = Math.sqrt(3 * d * slack / 8) * sc * 2 + wob;
  ctx.moveTo(X1, Y1); ctx.quadraticCurveTo((X1 + X2) / 2 + gx * sag, (Y1 + Y2) / 2 + gy * sag, X2, Y2);
}
function render() {
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = '#F6E9CF'; ctx.fillRect(0, 0, vw, vh);
  let sx = 0, sy = 0; if (shakeT > 0) { shakeT -= 1 / 60; const a = P.shake * Math.max(0, shakeT / 0.28); sx = (Math.random() - 0.5) * 2 * a; sy = (Math.random() - 0.5) * 2 * a; }
  ctx.save(); ctx.translate(sx, sy);
  const bw = W * sc, bh = H * sc;
  ctx.fillStyle = '#CDB787'; rr(ox - 8, oy - 4, bw + 16, bh + 16, 30); ctx.fill();
  ctx.fillStyle = '#E7D3AA'; rr(ox - 8, oy - 8, bw + 16, bh + 16, 30); ctx.fill();
  const gr = ctx.createLinearGradient(0, oy, 0, oy + bh); gr.addColorStop(0, '#B7BDF5'); gr.addColorStop(1, '#8F98E6');
  ctx.save(); rr(ox, oy, bw, bh, 22); ctx.clip(); ctx.fillStyle = gr; ctx.fillRect(ox, oy, bw, bh);
  ctx.globalAlpha = 0.28; ctx.fillStyle = ctx.createPattern(quilt, 'repeat'); ctx.fillRect(ox, oy, bw, bh); ctx.globalAlpha = 1;
  // pinchos
  for (const s of lv.d.spikes) {
    const X = ox + s.x * sc, Y = oy + s.y * sc, w = s.w * sc, hh = s.h * sc, n = Math.max(1, Math.round(s.w / 0.7)), tw = w / n;
    ctx.fillStyle = '#5B3F5E';
    if (s.w > s.h) { for (let i = 0; i < n; i++) { ctx.beginPath(); ctx.moveTo(X + i * tw, Y + hh); ctx.lineTo(X + i * tw + tw / 2, Y); ctx.lineTo(X + (i + 1) * tw, Y + hh); ctx.closePath(); ctx.fill(); } }
    else { rr(X, Y, w, hh, w / 2); ctx.fill(); ctx.fillStyle = 'rgba(255,255,255,0.2)'; rr(X + w * 0.2, Y + 4, w * 0.2, hh - 8, 4); ctx.fill(); }
  }
  // meta
  { const g = lv.d.goal, X = ox + g[0] * sc, Y = oy + g[1] * sc, R = GOAL_R * sc;
    ctx.fillStyle = '#FFD166'; ctx.beginPath(); ctx.arc(X, Y, R * 1.14, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#3a2a33'; ctx.beginPath(); ctx.arc(X, Y, R * 0.92, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.14)'; ctx.beginPath(); ctx.arc(X - R * 0.25, Y - R * 0.3, R * 0.3, 0, 6.283); ctx.fill(); }
  // hilos
  for (const t of threads) {
    if (!t.alive) continue;
    const s = Math.min(1, t.T / P.tmax), warn = s > 0.65, wob = warn ? Math.sin(timeNow * 60) * s * 1.2 : 0;
    ctx.lineCap = 'round';
    ctx.strokeStyle = 'rgba(40,40,100,0.25)'; ctx.lineWidth = 7; ctx.beginPath(); curve(t.ax, t.ay + 0.12, core.x, core.y + 0.12, t.L, wob); ctx.stroke();
    ctx.strokeStyle = warn ? mix([242, 135, 123], [226, 52, 52], (s - 0.65) / 0.35) : t.col; ctx.lineWidth = 5 + (warn ? s * 2.5 : 0);
    ctx.beginPath(); curve(t.ax, t.ay, core.x, core.y, t.L, wob); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,0.45)'; ctx.lineWidth = 1.5; ctx.setLineDash([3, 6]); ctx.beginPath(); curve(t.ax, t.ay, core.x, core.y, t.L, wob); ctx.stroke(); ctx.setLineDash([]);
  }
  for (const w of whips) {
    w.life -= 1 / 60; if (w.life <= 0) continue; const u = 1 - w.life / 0.35;
    ctx.strokeStyle = w.col; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.beginPath();
    const ex = w.ax + (w.bx - w.ax) * (1 - u) * 0.5 + Math.sin(u * 22 + w.seed) * 0.35 * (1 - u), ey = w.ay + (w.by - w.ay) * (1 - u) * 0.5;
    ctx.moveTo(ox + w.ax * sc, oy + w.ay * sc); ctx.lineTo(ox + ex * sc, oy + ey * sc); ctx.stroke();
  }
  whips = whips.filter(w => w.life > 0);
  // botones de anclaje
  for (const t of threads) {
    const X = ox + t.ax * sc, Y = oy + t.ay * sc, R = 0.34 * sc;
    ctx.fillStyle = 'rgba(30,30,90,0.3)'; ctx.beginPath(); ctx.arc(X + 2, Y + 4, R, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#FFF4DC'; ctx.beginPath(); ctx.arc(X, Y, R, 0, 6.283); ctx.fill();
    ctx.strokeStyle = '#D9C193'; ctx.lineWidth = 2; ctx.stroke();
    ctx.fillStyle = '#B79B66'; for (const [a, b] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) { ctx.beginPath(); ctx.arc(X + a * R * 0.28, Y + b * R * 0.28, R * 0.1, 0, 6.283); ctx.fill(); }
  }
  drawCore();
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 2; ctx.setLineDash([7, 7]); rr(ox + 7, oy + 7, bw - 14, bh - 14, 16); ctx.stroke(); ctx.setLineDash([]);
  for (let i = parts.length - 1; i >= 0; i--) {
    const p = parts[i]; p.life -= 1 / 60; if (p.life <= 0) { parts.splice(i, 1); continue; }
    p.vy += 14 / 60; p.x += p.vx / 60; p.y += p.vy / 60;
    ctx.globalAlpha = Math.min(1, p.life * 2); ctx.fillStyle = p.c; ctx.save(); ctx.translate(ox + p.x * sc, oy + p.y * sc); ctx.rotate(p.life * 8);
    ctx.fillRect(-p.r / 2 - 2, -p.r / 4 - 1, p.r + 4, p.r / 2 + 2); ctx.restore(); ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (dial.vis) drawDial();
}
function drawCore() {
  const R = CORE_R * sc, X = ox + core.x * sc, Y = oy + core.y * sc;
  let k = 1; if (core.st === 'in') k = Math.max(0, 1 - core.t / 0.35); if (core.st === 'dead') k = Math.max(0, 1 - core.t / 0.25);
  if (k <= 0) return;
  ctx.save(); ctx.translate(X, Y); ctx.scale(k, k);
  ctx.fillStyle = 'rgba(30,30,90,0.25)'; ctx.beginPath(); ctx.ellipse(R * 0.18, R * 0.38, R * 0.95, R * 0.82, 0, 0, 6.283); ctx.fill();
  const sp = Math.hypot(core.vx, core.vy), ang = Math.atan2(core.vy, core.vx);
  if (core.sq > 0) { const q = core.sq * 0.28, na = Math.atan2(core.sqy, core.sqx); ctx.rotate(na); ctx.scale(1 - q, 1 + q); ctx.rotate(-na); core.sq = Math.max(0, core.sq - 0.05); }
  const sxs = 1 + Math.min(0.25, sp * 0.012); ctx.rotate(ang); ctx.scale(sxs, 1 / sxs); ctx.rotate(-ang);
  // pelusa: pequeños bultos alrededor
  ctx.fillStyle = '#FFC24A'; for (let i = 0; i < 14; i++) { const a = i / 14 * 6.283 + 0.2; ctx.beginPath(); ctx.arc(Math.cos(a) * R * 0.92, Math.sin(a) * R * 0.92, R * 0.2, 0, 6.283); ctx.fill(); }
  const gr = ctx.createRadialGradient(-R * 0.35, -R * 0.4, R * 0.1, 0, 0, R * 1.05); gr.addColorStop(0, '#FFF2C2'); gr.addColorStop(0.4, '#FFD166'); gr.addColorStop(1, '#F2B33E');
  ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, R, 0, 6.283); ctx.fill();
  const scared = core.stress > 0.75 || sp > 10, blinkT = (timeNow + 1.3) % 4.2, eh = blinkT > 4.05 ? 0.12 : 1;
  const tx = lv.d.goal[0] - core.x, ty = lv.d.goal[1] - core.y, td = Math.hypot(tx, ty) || 1, lx = tx / td * R * 0.09, ly = ty / td * R * 0.09;
  for (const s of [-1, 1]) {
    const ex = s * R * 0.34, ey = -R * 0.08, sz = scared ? 1.25 : 1;
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.ellipse(ex, ey, R * 0.22 * sz, R * 0.27 * eh * sz, 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = '#3b2f3a'; ctx.beginPath(); ctx.ellipse(ex + lx, ey + ly * eh, R * (scared ? 0.08 : 0.11), R * 0.15 * eh * (scared ? 0.8 : 1), 0, 0, 6.283); ctx.fill();
    ctx.fillStyle = 'rgba(244,120,140,0.5)'; ctx.beginPath(); ctx.arc(s * R * 0.58, R * 0.24, R * 0.14, 0, 6.283); ctx.fill();
  }
  ctx.strokeStyle = '#3b2f3a'; ctx.lineWidth = Math.max(1.5, R * 0.07); ctx.lineCap = 'round'; ctx.beginPath();
  if (scared) ctx.ellipse(0, R * 0.4, R * 0.1, R * 0.13, 0, 0, 6.283); else ctx.arc(0, R * 0.2, R * 0.2, 0.25 * Math.PI, 0.75 * Math.PI);
  ctx.stroke(); ctx.restore();
}
function drawDial() {
  const { cx, cy, r } = dial;
  ctx.fillStyle = 'rgba(30,30,90,0.2)'; ctx.beginPath(); ctx.arc(cx + 2, cy + 4, r, 0, 6.283); ctx.fill();
  ctx.fillStyle = '#E7D3AA'; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 6.283); ctx.fill();
  ctx.strokeStyle = '#CDB787'; ctx.lineWidth = 3; ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.7)'; ctx.lineWidth = 2; ctx.setLineDash([5, 5]); ctx.beginPath(); ctx.arc(cx, cy, r - 7, 0, 6.283); ctx.stroke(); ctx.setLineDash([]);
  const kx = cx + gx * (r - 14), ky = cy + gy * (r - 14);
  ctx.strokeStyle = '#4A3B47'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.lineTo(kx, ky); ctx.stroke();
  ctx.fillStyle = '#F2877B'; ctx.beginPath(); ctx.arc(kx, ky, 11, 0, 6.283); ctx.fill(); ctx.strokeStyle = '#C9665B'; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = '#4A3B47'; ctx.beginPath(); ctx.arc(cx, cy, 4, 0, 6.283); ctx.fill();
  ctx.font = '600 13px Fredoka, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = 'rgba(74,59,71,0.75)'; ctx.fillText('Gravedad', cx, cy - r - 8);
}

/* ---------- Bucle principal ---------- */
let last = 0, acc = 0;
function frame(t) {
  const dt = Math.min(0.05, (t - last) / 1000); last = t; acc += dt;
  while (acc >= DT) { simStep(); acc -= DT; }
  render(); requestAnimationFrame(frame);
}

/* ---------- Interfaz ---------- */
const $ = id => document.getElementById(id);
$('prev').onclick = () => loadLevel(li - 1); $('next').onclick = () => loadLevel(li + 1);
$('restart').onclick = () => loadLevel(li, true); $('retry').onclick = () => loadLevel(li, true); $('again2').onclick = () => loadLevel(li + 1);
$('copy').onclick = async () => { const el = $('copy'); try { await navigator.clipboard.writeText(statsText()); el.textContent = 'Copiado'; } catch (e) { el.textContent = 'No se pudo copiar'; } };
const sndBtn = $('snd'); const paintSnd = () => sndBtn.classList.toggle('off', !audioOn);
sndBtn.onclick = () => { audioOn = !audioOn; try { localStorage.setItem('hilos.snd', audioOn ? '1' : '0'); } catch (e) {} if (audioOn) initAudio(); paintSnd(); }; paintSnd();
const CTLS = [['Fuerza de la gravedad', 'g', 8, 40, 1], ['Elasticidad del hilo (rigidez)', 'k', 40, 200, 5], ['Resistencia del hilo', 'tmax', 25, 90, 1],
  ['Zona de toque para cortar (px)', 'cutTol', 14, 60, 1], ['Pausa de impacto al cortar (ms)', 'hitstop', 0, 140, 5], ['Sacudida de pantalla (px)', 'shake', 0, 12, 1]];
function buildCtls() {
  const box = $('ctls'); box.innerHTML = '';
  for (const [lab, key, mn, mx, st] of CTLS) {
    const d = document.createElement('div'); d.className = 'ctl';
    d.innerHTML = '<label for="c_' + key + '">' + lab + '</label><output id="o_' + key + '"></output><input id="c_' + key + '" type="range" min="' + mn + '" max="' + mx + '" step="' + st + '">';
    box.appendChild(d); const inp = d.querySelector('input'), out = d.querySelector('output'); inp.value = P[key]; out.textContent = P[key];
    inp.oninput = () => { P[key] = parseFloat(inp.value); out.textContent = P[key]; try { localStorage.setItem('hilos.P', JSON.stringify(P)); } catch (e) {} };
  }
  $('mDial').classList.toggle('on', gravMode === 'dial'); $('mTilt').classList.toggle('on', gravMode === 'tilt');
}
$('cfg').onclick = () => { buildCtls(); $('panel').hidden = !$('panel').hidden; };
$('closeP').onclick = () => { $('panel').hidden = true; };
$('reset').onclick = () => { Object.assign(P, DEFAULTS); try { localStorage.removeItem('hilos.P'); } catch (e) {} buildCtls(); };
$('mDial').onclick = () => setMode('dial'); $('mTilt').onclick = () => setMode('tilt');

/* gancho para pruebas automáticas */
window.__t = { P, get lv() { return lv; }, get core() { return core; }, get threads() { return threads; }, get li() { return li; }, loadLevel, simStep,
  setG(x, y) { const n = Math.hypot(x, y) || 1; gx = x / n; gy = y / n; }, cut(i) { if (threads[i] && threads[i].alive) snap(threads[i], false); }, LEVELS, onMotion,
  get g() { return [gx, gy]; } };

loadLevel(0); if (gravMode === 'tilt') enableTilt(); requestAnimationFrame(frame);
})();
</script>
