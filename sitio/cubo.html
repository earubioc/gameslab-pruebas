<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Cubo Cebolla</title>
<style>
@font-face{font-family:'Fredoka';font-style:normal;font-weight:300 700;font-display:swap;src:url(fonts/fredoka-latin.woff2) format('woff2');}
</style>
<style>
/* Prototipo C: el cubo en capas. Tres mecánicas (tela cenital, cuerdas con trampolín, puzle de colores) en un recorrido infinito.
   Composición: menú con cubo de fieltro, tablero vertical, barra superior de botones de fieltro, transición de cubo en 3D. */
:root{
  --crema:#F6E9CF; --crema-oscuro:#E7D3AA; --tinta:#4A3B47; --coral:#F2877B; --sol:#FFD166; --menta:#7CCDB9; --lila:#9FA8F0;
  --c1:#F5A25D; --c2:#6FB3F2; --c3:#FFD166;
  --display:'Fredoka',ui-rounded,'Hiragino Maru Gothic ProN','Segoe UI Rounded',system-ui,sans-serif;
  color-scheme: light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--crema);color:var(--tinta);font-family:var(--display);overscroll-behavior:none;overflow:hidden;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.bar{position:fixed;left:0;right:0;top:0;height:56px;padding:6px 12px;display:flex;align-items:center;justify-content:space-between;gap:6px;pointer-events:none}
.bar[hidden]{display:none}
.grp{display:flex;align-items:center;gap:6px;pointer-events:auto}
.btn{width:40px;height:40px;border-radius:13px;background:var(--crema-oscuro);display:grid;place-items:center;box-shadow:0 3px 0 #CDB787, inset 0 1px 0 rgba(255,255,255,.55);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #CDB787, inset 0 1px 0 rgba(255,255,255,.55)}
.btn:focus-visible,.pill:focus-visible,.cta:focus-visible,.menu button:focus-visible,.tab:focus-visible,.item:focus-visible{outline:3px solid var(--coral);outline-offset:2px}
.btn svg{width:22px;height:22px;stroke:var(--tinta);fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.lvl{max-width:150px;text-align:left;font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{height:40px;padding:0 12px;border-radius:13px;background:#fff8e8;display:flex;align-items:center;gap:4px;font-weight:600;font-size:17px;box-shadow:0 3px 0 #CDB787;font-variant-numeric:tabular-nums}
.badge i{font-style:normal;color:#E8A317}
.hint{position:fixed;left:50%;top:60px;transform:translateX(-50%);max-width:min(94vw,460px);text-align:center;background:rgba(74,59,71,.92);color:#fff;padding:9px 16px;border-radius:999px;font-size:15px;line-height:1.25;pointer-events:none;transition:opacity .35s;z-index:3}
.hint.gone{opacity:0}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);max-width:min(92vw,420px);background:rgba(74,59,71,.95);color:#fff;padding:10px 16px;border-radius:16px;font-size:14px;line-height:1.3;text-align:center;z-index:30;pointer-events:none}
.toast[hidden]{display:none}
.overlay{position:fixed;inset:0;display:grid;place-items:center;background:rgba(74,59,71,.38);padding:16px;z-index:12}
.overlay[hidden]{display:none}
.card{width:min(92vw,340px);background:var(--crema);border-radius:26px;padding:22px 20px 18px;text-align:center;box-shadow:0 8px 0 #CDB787,0 18px 40px rgba(0,0,0,.25);animation:pop .28s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.8);opacity:0}to{transform:scale(1);opacity:1}}
.card h2{margin:0 0 4px;font-size:28px;font-weight:600}
.card .sub{margin:0 0 10px;opacity:.75;font-size:15px}
.starsRow{display:flex;justify-content:center;gap:6px;margin:4px 0 8px;font-size:44px;line-height:1}
.starsRow span{color:#E3D3B0;display:inline-block;transition:transform .3s}
.starsRow span.on{color:#F2B21B;text-shadow:0 3px 0 #C98A0A;animation:starpop .5s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starpop{from{transform:scale(0) rotate(-40deg)}to{transform:scale(1) rotate(0)}}
.crit{list-style:none;margin:0 0 12px;padding:0;text-align:left;font-size:15px}
.crit li{display:flex;justify-content:space-between;padding:5px 10px;background:#fff8e8;border-radius:10px;margin-bottom:5px}
.crit li.no{opacity:.55}
.cta{display:block;width:100%;padding:13px;border-radius:16px;background:var(--coral);color:#fff;font-size:19px;font-weight:600;box-shadow:0 4px 0 #C9665B;margin-bottom:10px}
.cta:active{transform:translateY(2px);box-shadow:0 2px 0 #C9665B}
.row{display:flex;gap:8px}
.pill{flex:1;padding:10px;border-radius:14px;background:var(--crema-oscuro);font-size:15px;font-weight:500;box-shadow:0 3px 0 #CDB787}
.pill:active{transform:translateY(2px);box-shadow:0 1px 0 #CDB787}
.pill.on{background:var(--lila);color:#fff;box-shadow:0 3px 0 #7983D6}
.panel{position:fixed;left:0;right:0;bottom:0;background:var(--crema);border-radius:24px 24px 0 0;padding:16px 18px 20px;box-shadow:0 -8px 30px rgba(0,0,0,.25);max-height:78%;overflow:auto;z-index:14}
.panel[hidden]{display:none}
.panel h3{margin:0 0 6px;font-size:20px}
.panel p.note{margin:0 0 10px;font-size:13px;opacity:.7;line-height:1.3}
.ctl{display:grid;grid-template-columns:1fr 54px;gap:2px 10px;align-items:center;margin-bottom:8px}
.ctl output{font-variant-numeric:tabular-nums;text-align:right;font-size:14px;opacity:.8}
.ctl input{grid-column:1 / -1;width:100%;accent-color:var(--coral);height:28px}
/* menú */
.screen{position:fixed;inset:0;background:var(--crema);z-index:10;overflow:auto;display:flex;flex-direction:column;align-items:center;padding:20px 18px 24px}
.screen[hidden]{display:none}
.logo{height:150px;display:grid;place-items:center;perspective:700px;margin-top:6px}
.lcube{width:96px;height:96px;position:relative;transform-style:preserve-3d;animation:spin 16s linear infinite}
@keyframes spin{from{transform:rotateX(-24deg) rotateY(25deg)}to{transform:rotateX(-24deg) rotateY(385deg)}}
.lf{position:absolute;inset:0;border-radius:10px;border:3px dashed rgba(255,255,255,.7);box-shadow:inset 0 0 0 4px rgba(0,0,0,.06)}
.lf.a{background:var(--c1);transform:translateZ(48px)}
.lf.b{background:var(--c2);transform:rotateY(90deg) translateZ(48px)}
.lf.c{background:var(--c3);transform:rotateY(180deg) translateZ(48px)}
.lf.d{background:var(--c2);transform:rotateY(-90deg) translateZ(48px)}
.lf.e{background:var(--c3);transform:rotateX(90deg) translateZ(48px)}
.lf.f{background:var(--c1);transform:rotateX(-90deg) translateZ(48px)}
.lf::after{content:"";position:absolute;inset:14px;border:4px solid rgba(255,255,255,.55);border-radius:6px;clip-path:polygon(0 0,70% 0,70% 30%,40% 30%,40% 70%,100% 70%,100% 100%,0 100%)}
.screen h1{margin:4px 0 0;font-size:34px;font-weight:600;letter-spacing:.3px}
.screen .tag{margin:2px 0 14px;font-size:14px;opacity:.7;text-align:center}
.menu{width:min(100%,380px);display:flex;flex-direction:column;gap:10px}
.menu button{width:100%;padding:13px 16px;border-radius:18px;background:var(--crema-oscuro);font-size:19px;font-weight:600;box-shadow:0 4px 0 #CDB787;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px}
.menu button small{font-size:13px;font-weight:400;opacity:.75;text-align:right}
.menu button.main{background:var(--coral);color:#fff;box-shadow:0 5px 0 #C9665B;padding:16px}
.menu button:active{transform:translateY(2px)}
.menu .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menu .two button{flex-direction:column;align-items:flex-start;font-size:17px}
/* colección */
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:8px 0}
.tab{padding:8px 12px;border-radius:12px;background:var(--crema-oscuro);font-size:14px;font-weight:500;box-shadow:0 2px 0 #CDB787}
.tab.on{background:var(--lila);color:#fff}
.grid{width:min(100%,400px);display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.item{background:#fff8e8;border-radius:16px;padding:10px 8px;text-align:center;box-shadow:0 3px 0 #E0CFA8}
.item canvas{width:64px;height:64px}
.item b{display:block;font-size:15px;margin-top:2px}
.item span{display:block;font-size:13px;opacity:.8;margin-top:2px}
.item.eq{outline:3px solid var(--menta)}
.item.lock{opacity:.9}
/* cubo 3D de transición */
#cubeStage{position:fixed;inset:0;z-index:20;background:var(--crema);perspective:1100px;overflow:hidden}
#cubeStage[hidden]{display:none}
.cwrap{position:absolute;inset:0;display:grid;place-items:center;transform-style:preserve-3d}
#cube,#shell{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
.face{position:absolute;inset:0;background-size:cover;background-position:center;border-radius:14px;border:3px dashed rgba(255,255,255,.65);backface-visibility:hidden}
.sface{position:absolute;inset:0;border-radius:16px;border:4px dashed rgba(255,255,255,.7);opacity:.96}
#door{position:fixed;inset:0;z-index:18;display:grid;place-items:center;background:rgba(74,59,71,.25)}
#door[hidden]{display:none}
.dframe{position:relative;width:min(70vw,260px);height:min(46vh,340px);overflow:hidden;border-radius:18px;background:radial-gradient(circle,#FFF6CF,#FFD166);box-shadow:0 8px 0 #CDB787,0 18px 40px rgba(0,0,0,.3)}
.dframe i{position:absolute;top:0;bottom:0;width:50%;background:var(--c1);border:4px dashed rgba(255,255,255,.7);transition:transform .9s cubic-bezier(.5,0,.2,1)}
.dframe i.l{left:0}.dframe i.r{right:0;background:var(--c2)}
.dframe.open i.l{transform:translateX(-102%)}.dframe.open i.r{transform:translateX(102%)}
.dframe b{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;font-weight:600;text-align:center;padding:0 12px}
#pzbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;align-items:center;padding:8px 12px 14px;background:linear-gradient(transparent,var(--crema) 40%)}
#pzbar[hidden]{display:none}
#rbar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;align-items:center;padding:8px 12px 14px;background:linear-gradient(transparent,var(--crema) 40%)}
#rbar[hidden]{display:none}
#rbar .pill{flex:none;padding:10px 16px}
#fps{position:fixed;right:8px;bottom:6px;font:600 12px system-ui,sans-serif;color:#fff;background:rgba(40,40,100,.6);padding:3px 7px;border-radius:8px;pointer-events:none}
#fps[hidden]{display:none}
#pzbar .pill{flex:none;padding:10px 16px}
#pzcount{font-weight:600;font-size:17px;min-width:92px;text-align:center}
@media (prefers-reduced-motion:reduce){.card,.starsRow span.on{animation:none}.lcube{animation:none;transform:rotateX(-24deg) rotateY(25deg)}.hint{transition:none}}
</style>
</head>
<body>
<div id="stage"><canvas id="cv" aria-label="Tablero del juego"></canvas></div>

<div class="bar" id="bar" hidden>
  <div class="grp">
    <button class="btn" id="back" aria-label="Volver al menú"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="lvl" id="lbl"></div>
  </div>
  <div class="grp">
    <div class="badge" id="starsB" aria-label="Estrellas"><i>★</i><span id="starsN">0</span></div>
    <button class="btn" id="restart" aria-label="Reiniciar"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6.2"/><path d="M4 4v5h5"/></svg></button>
    <button class="btn" id="cfg" aria-label="Ajustes"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg></button>
  </div>
</div>
<div class="hint gone" id="hint"></div>
<div id="pzbar" hidden><button class="pill" id="pzHint">Pista</button><div id="pzcount"></div><button class="pill" id="pzClear">Limpiar</button></div>
<div id="rbar" hidden><button class="pill" id="rDemo">Ver cómo</button><button class="pill" id="rSkip" hidden>Saltar sala</button></div>
<div id="fps" hidden></div>
<div class="toast" id="toast" hidden></div>

<div class="screen" id="hub">
  <div class="logo"><div class="lcube"><div class="lf a"></div><div class="lf b"></div><div class="lf c"></div><div class="lf d"></div><div class="lf e"></div><div class="lf f"></div></div></div>
  <h1>Cubo Cebolla</h1>
  <p class="tag">Nombre de trabajo. Un cubo con capas dentro de capas.</p>
  <div class="menu">
    <button class="main" id="mCubo"><span>Jugar el Cubo</span><small id="mCuboS">Capa 1</small></button>
    <div class="two">
      <button id="mMem"><span>Membrana</span><small id="mMemS">Nivel 1</small></button>
      <button id="mRope"><span>Cuerdas</span><small id="mRopeS">Sala 1</small></button>
    </div>
    <div class="two">
      <button id="mCol"><span>Colores</span><small id="mColS">Práctica</small></button>
      <button id="mShop"><span>Colección</span><small id="mShopS">0 estrellas</small></button>
    </div>
    <button id="mEdit"><span>Crear niveles</span><small>editor de Membrana</small></button>
    <button id="mCfg"><span>Ajustes</span><small>sonido y control</small></button>
  </div>
</div>

<div class="screen" id="shop" hidden>
  <div class="row" style="width:min(100%,400px);align-items:center;margin-bottom:4px"><button class="btn" id="shopBack" aria-label="Volver"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button><h1 style="font-size:26px;margin:0 auto">Colección</h1><div class="badge"><i>★</i><span id="shopStars">0</span></div></div>
  <p class="tag">Las estrellas no se compran ni se pierden: se ganan jugando.</p>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
</div>

<div class="overlay" id="win" hidden>
  <div class="card" role="dialog" aria-labelledby="winT">
    <h2 id="winT">¡Listo!</h2>
    <p class="sub" id="winS"></p>
    <div class="starsRow" id="winStars"></div>
    <ul class="crit" id="winCrit"></ul>
    <button class="cta" id="winCta">Continuar</button>
    <div class="row"><button class="pill" id="winRetry">Repetir</button><button class="pill" id="winMenu">Menú</button></div>
  </div>
</div>

<div class="panel" id="panel" hidden>
  <h3>Ajustes</h3>
  <div class="row" style="margin-bottom:8px"><button class="pill" id="optSnd">Sonido: sí</button><button class="pill" id="optFps">Mostrar fps</button></div>
  <div class="ctl"><label for="offR">Desfase del dedo en Membrana (px)</label><output id="offO"></output><input id="offR" type="range" min="0" max="100" step="2"></div>
  <div class="row" style="margin-bottom:8px"><button class="pill" id="optReset">Borrar progreso</button><button class="pill" id="optClose">Cerrar</button></div>
</div>

<div id="door" hidden><div class="dframe" id="dframe"><b id="doorT">Puerta cerrada</b><i class="l"></i><i class="r"></i></div></div>

<div id="cubeStage" hidden>
  <div class="cwrap">
    <div id="cube"></div>
    <div id="shell"></div>
  </div>
</div>

<script>
/* Puzle de colores: una pieza por región, por fila y por columna, sin tocarse ni en diagonal.
   Núcleo sin DOM: se usa en el juego y en las pruebas de Node. El género es conocido (Star Battle, Queens); las reglas son libres. */
(function (root) {
'use strict';

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function shuffle(a, rnd) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

/* Una colocación válida: una por fila y por columna, sin tocarse en diagonal. Devuelve la columna de cada fila. */
function randomPlacement(N, rnd) {
  const cols = new Array(N).fill(-1), used = new Array(N).fill(false);
  function go(r) {
    if (r === N) return true;
    for (const c of shuffle([...Array(N).keys()], rnd)) {
      if (used[c] || (r > 0 && Math.abs(c - cols[r - 1]) <= 1)) continue;
      cols[r] = c; used[c] = true;
      if (go(r + 1)) return true;
      used[c] = false; cols[r] = -1;
    }
    return false;
  }
  return go(0) ? cols : null;
}

/* Reparte el tablero en N regiones conexas, cada una con exactamente una celda de la solución. */
function growRegions(N, sol, rnd) {
  const reg = Array.from({ length: N }, () => new Array(N).fill(-1));
  sol.forEach((c, r) => { reg[r][c] = r; });
  let remaining = N * N - N;
  const D = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  while (remaining > 0) {
    const pairs = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (reg[r][c] < 0) continue;
      for (const [dr, dc] of D) { const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < N && cc >= 0 && cc < N && reg[rr][cc] < 0) pairs.push([rr, cc, reg[r][c]]); }
    }
    const [r, c, g] = pairs[Math.floor(rnd() * pairs.length)];
    reg[r][c] = g; remaining--;
  }
  return reg;
}

/* Cuenta soluciones (hasta `limit`) y las devuelve. */
function solutions(N, reg, limit) {
  const out = [], cols = new Array(N).fill(-1), colUsed = new Array(N).fill(false), regUsed = new Array(N).fill(false);
  function go(r) {
    if (out.length >= limit) return;
    if (r === N) { out.push(cols.slice()); return; }
    for (let c = 0; c < N; c++) {
      if (colUsed[c]) continue;
      const g = reg[r][c]; if (regUsed[g]) continue;
      if (r > 0 && Math.abs(c - cols[r - 1]) <= 1) continue;
      colUsed[c] = regUsed[g] = true; cols[r] = c;
      go(r + 1);
      colUsed[c] = regUsed[g] = false; cols[r] = -1;
    }
  }
  go(0);
  return out;
}

/* ¿La región g sigue siendo conexa si se le quita la celda (r0, c0)? */
function connectedWithout(N, reg, g, r0, c0) {
  const cells = []; for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) if (reg[r][c] === g && !(r === r0 && c === c0)) cells.push([r, c]);
  if (!cells.length) return false;
  const seen = new Set([cells[0][0] * N + cells[0][1]]), q = [cells[0]];
  while (q.length) { const [r, c] = q.pop(); for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < N && cc >= 0 && cc < N && reg[rr][cc] === g && !(rr === r0 && cc === c0) && !seen.has(rr * N + cc)) { seen.add(rr * N + cc); q.push([rr, cc]); } } }
  return seen.size === cells.length;
}

/* Reparación local: mueve celdas de frontera entre regiones (sin tocar las de la solución) hasta que quede una sola solución. */
function repair(N, reg, sol, rnd, moves) {
  const isSol = (r, c) => sol[r] === c;
  let count = solutions(N, reg, 2).length;
  for (let m = 0; m < moves && count > 1; m++) {
    const r = Math.floor(rnd() * N), c = Math.floor(rnd() * N); if (isSol(r, c)) continue;
    const old = reg[r][c], nb = [];
    for (const [dr, dc] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) { const rr = r + dr, cc = c + dc; if (rr >= 0 && rr < N && cc >= 0 && cc < N && reg[rr][cc] !== old) nb.push(reg[rr][cc]); }
    if (!nb.length || !connectedWithout(N, reg, old, r, c)) continue;
    reg[r][c] = nb[Math.floor(rnd() * nb.length)];
    const n = solutions(N, reg, 2).length;
    if (n <= count && n >= 1) count = n; else reg[r][c] = old;
  }
  return count === 1;
}

/* Puzle con solución única. Determinista según la semilla. */
function genPuzzle(N, seed) {
  const rnd = mulberry32((seed * 2654435761 + N * 97) >>> 0);
  for (let attempt = 1; attempt <= 3000; attempt++) {
    const sol = randomPlacement(N, rnd); if (!sol) continue;
    const reg = growRegions(N, sol, rnd);
    if (solutions(N, reg, 2).length === 1 || repair(N, reg, sol, rnd, 80)) return { N, reg, sol, seed, attempts: attempt };
  }
  return null;
}

/* Piezas colocadas: lista de [fila, columna]. Devuelve los índices de las piezas que chocan con otra. */
function conflicts(reg, pieces) {
  const bad = new Set();
  for (let i = 0; i < pieces.length; i++) for (let j = i + 1; j < pieces.length; j++) {
    const [r1, c1] = pieces[i], [r2, c2] = pieces[j];
    if (r1 === r2 || c1 === c2 || reg[r1][c1] === reg[r2][c2] || (Math.abs(r1 - r2) <= 1 && Math.abs(c1 - c2) <= 1)) { bad.add(i); bad.add(j); }
  }
  return bad;
}

/* Dificultad por capa: tamaño del tablero. */
function sizeForLayer(layer) { return Math.min(8, 4 + Math.floor((layer - 1) / 2)); }

function backToMenu() { toHub(); }

/* ---------- Colección ---------- */
let shopTab = 'c';
function drawItemPreview(c, it) {
  const g = c.getContext('2d'); g.clearRect(0, 0, c.width, c.height); const cx = c.width / 2, cy = c.height / 2;
  if (it.cat === 'k') { it.val.forEach((col, i) => { g.fillStyle = col; g.beginPath(); g.roundRect(8 + i * 38, 26, 32, 32, 8); g.fill(); }); return; }
  const o = { color: ballCol('sol'), face: 'f_normal', acc: 'a_none', look: [0, 1] }; if (it.cat === 'c') o.color = it.val; if (it.cat === 'a') o.acc = it.id; if (it.cat === 'f') o.face = it.id; drawPom(g, cx, cy + 4, 34, o);
}
function renderShop() {
  const tabs = $('tabs'); tabs.innerHTML = ''; for (const k of Object.keys(CATS)) { const b = document.createElement('button'); b.className = 'tab' + (k === shopTab ? ' on' : ''); b.textContent = CATS[k]; b.onclick = () => { shopTab = k; renderShop(); }; tabs.appendChild(b); }
  const grid = $('grid'); grid.innerHTML = '';
  for (const it of ITEMS.filter(i => i.cat === shopTab)) {
    const own = S.owned.includes(it.id), eq = S.equip[it.cat] === it.id, d = document.createElement('button'); d.className = 'item' + (eq ? ' eq' : '') + (own ? '' : ' lock');

    d.appendChild(cvs); d.appendChild(nm); d.appendChild(st);
    d.onclick = () => { if (own) { S.equip[it.cat] = it.id; save(); renderShop(); return; } if (S.stars >= it.cost) { S.stars -= it.cost; S.owned.push(it.id); S.equip[it.cat] = it.id; save(); updateBadge(); note(7, 0.25, 0.12, 'sine'); renderShop(); toast('¡' + it.name + ' desbloqueado!'); } else toast('Te faltan ' + (it.cost - S.stars) + ' ★. Se ganan jugando.'); };
    grid.appendChild(d);
  }
}

/* ---------- Menú, ajustes, botones ---------- */
function paintOpts() { $('optFps').textContent = S.fps ? 'Ocultar fps' : 'Mostrar fps'; $('fps').hidden = !S.fps; $('optSnd').textContent = 'Sonido: ' + (S.sound ? 'sí' : 'no'); $('offR').value = S.offset; $('offO').textContent = S.offset; }
let armedReset = 0;
$('mCubo').onclick = () => { initAudio(); startCubo(S.cubeLayer); }; $('mMem').onclick = () => { initAudio(); startMem(S.mem); }; $('mRope').onclick = () => { initAudio(); startRope(S.rope); };
$('mCol').onclick = () => { initAudio(); startColChoice(); }; $('mShop').onclick = () => { $('hub').hidden = true; $('shop').hidden = false; renderShop(); updateBadge(); };
$('shopBack').onclick = () => { $('shop').hidden = true; refreshHub(); $('hub').hidden = false; };
$('mEdit').onclick = () => { if (/(^|\.)github\.io$/.test(location.hostname) || location.hostname === 'localhost') location.href = 'membrana.html'; else toast('El editor de niveles está en el prototipo Membrana, en la página de pruebas.'); };
$('mCfg').onclick = () => { paintOpts(); $('panel').hidden = false; }; $('cfg').onclick = () => { paintOpts(); $('panel').hidden = !$('panel').hidden; }; $('optClose').onclick = () => { $('panel').hidden = true; };
$('optSnd').onclick = () => { S.sound = !S.sound; save(); if (S.sound) initAudio(); paintOpts(); };

$('offR').oninput = e => { S.offset = Number(e.target.value); $('offO').textContent = S.offset; save(); };
$('optReset').onclick = () => { if (armedReset) { clearTimeout(armedReset); armedReset = 0; S = defSave(); save(); updateBadge(); refreshHub(); $('panel').hidden = true; toast('Progreso borrado.'); } else { toast('Toca otra vez para borrar todo el progreso.'); armedReset = setTimeout(() => { armedReset = 0; }, 2800); } };
$('back').onclick = backToMenu;
$('restart').onclick = () => { if (G.busy) return; if (G.scene === 'puzzle' && G.puzzle) { const P = G.puzzle; for (let r = 0; r < P.N; r++) for (let c = 0; c < P.N; c++) if (!P.locked.has(r * P.N + c)) P.cells[r][c] = 0; pzCheck(P); } else if (G.room) { const R = G.room; R.attempts++; const k = R.attempts; buildSim(R); R.attempts = k; R.sim.started = true; } };
$('rDemo').onclick = () => { if (G.busy) return; initAudio(); startDemo(G.room); };
$('rSkip').onclick = () => { if (G.busy || !G.room) return; $('rbar').hidden = true; if (G.mode === 'cubo') cuboNext(); else if (G.mode === 'rope') startRope(G.idx + 1); };
$('optFps').onclick = () => { S.fps = !S.fps; save(); paintOpts(); };
$('pzHint').onclick = () => { if (G.puzzle && !G.busy) pzHint(G.puzzle); }; $('pzClear').onclick = () => $('restart').click();

/* ---------- Ganchos de prueba ---------- */
function botRoom(R) {
  if (R.kind === 'mem') { const sim = R.sim, d = R.def, lead = (d.bot && d.bot.lead) || 1.3, adv = (d.bot && d.bot.adv) || 0.9; let wi = 0, last = 0, lx = null, ly = null, n = 0; sim.started = true;
    while (n++ < 120 * 90 && sim.state === 'play') { const b = sim.balls.find(q => q.st === 'play'); if (!b) { sim.step(); continue; } const si = Math.min(b.i, d.route.length - 1), seg = d.route[si]; if (si !== last) { wi = 0; last = si; }
      const t = seg[Math.min(wi, seg.length - 1)], dd = Math.hypot(t[0] - b.x, t[1] - b.y); if (dd < adv && wi < seg.length - 1) wi++; const l = Math.min(lead, dd), fx = b.x + (t[0] - b.x) / (dd || 1) * l, fy = b.y + (t[1] - b.y) / (dd || 1) * l;
      if (lx !== null) R.trazo += Math.hypot(fx - lx, fy - ly); lx = fx; ly = fy; sim.fingers.set(1, { x: fx, y: fy, env: 1 }); sim.step(); }
    sim.fingers.clear(); R.touches = 1; }
  else { const r = CC.replay(R.def, R.meta.acts, 9); /* reproducción sobre una copia; se repite sobre la simulación viva */
    const sim = R.sim, acts = R.meta.acts; let i = 0, rel = null, n = 0; while (n++ < 240 * 9 && sim.state === 'play') { while (i < acts.length && sim.time >= acts[i].t - 1e-9) { const a = acts[i++]; if (a.type === 'cut') sim.cut(a.i); else if (a.type === 'shot') sim.shoot(a.ang, a.spd); else { sim.setPull(a.x, a.depth); rel = sim.time + a.hold; } } if (rel !== null && sim.time >= rel) { sim.releasePull(); rel = null; } sim.step(); } }
  checkRoom(R);
}
function botPuzzle(P) { for (let r = 0; r < P.N; r++) P.cells[r][P.sol[r]] = 2; pzCheck(P); }
